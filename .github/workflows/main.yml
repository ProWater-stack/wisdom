name: Wisdom2.0 CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Check Node version
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Install backend dependencies
        run: |
          cd backend
          npm install


      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install